# This is a basic workflow to help you get started with Actions

name: ec2-automation

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
  

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
    # The type of runner that the job will run on
  create-ec2-instance:
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Setting up AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: my-new-session
          role-duration-seconds: 3600

      - name: Create EC2 Instance for Automation
        run: |
          aws ec2 run-instances --image-id ami-0fa3fe0fa7920f68e --count 1 --instance-type t2.micro --key-name new_kp --security-groups sg-01d0ea0d95da426cf

      
